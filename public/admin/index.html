<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>داشبورد نقشهٔ هزار مشعل</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#30345a">
<style>
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-Regular.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-Medium.woff") format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-SemiBold.woff") format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-Bold.woff") format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-ExtraBold.woff") format("woff");font-weight:800;font-display:swap}
:root{
  color-scheme:light;
  --bg:#fff;--sunken:#f4f5f8;--ink:#30345a;--ink-2:#555a7d;--muted:#81859f;--line:#eaeaea;--line-2:#dcdee7;
  --green:#2fb57c;--green-600:#23905f;--green-100:#e3f5ec;
  --peri:#6e7fd9;--peri-100:#eceffb;--amber:#e8ae30;--amber-100:#fcf3de;--amber-ink:#87610f;--crimson:#db2a58;--crimson-100:#fbe5ec;--sky:#40bbe7;--sky-100:#e2f4fb;--sky-ink:#13739d;
  --focus:0 0 0 3px rgba(110,127,217,.35);--sh1:0 1px 2px rgba(48,52,90,.05),0 2px 8px rgba(48,52,90,.05);--sh4:0 24px 64px rgba(48,52,90,.24);
  --font:"Ravagh","Vazirmatn","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--sunken)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.85;direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
[hidden]{display:none!important}
a{color:var(--green-600)}
.logo{height:28px;width:auto;display:block}
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;gap:12px}
.bar-in .ttl{font-weight:800;font-size:15px;white-space:nowrap}
.uname{max-width:40vw;min-width:0}.uname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media(max-width:560px){.rtx{display:none}}
@media(max-width:400px){.ttl{display:none}}
.sp{flex:1}
.tabs{max-width:1240px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto}
.tabs button{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
@media(max-width:420px){.tabs{gap:4px}.tabs button{flex:1 1 auto;padding:6px 8px;font-size:12.5px}}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:24px;line-height:1.5;margin:4px 0 4px}
h2{font-size:18px;margin:0 0 6px}
.lead{color:var(--ink-2);margin:0 0 16px}
.hint{font-size:13px;color:var(--muted)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--sh1)}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid transparent;padding:0 18px;height:42px;font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none}
.btn.pr{background:var(--green);color:#fff}.btn.pr:hover{background:var(--green-600)}
.btn.se{background:var(--bg);border-color:var(--line-2);color:var(--ink)}.btn.se:hover{background:var(--sunken)}
.btn.dk{background:var(--ink);color:#fff}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--green-600);font-weight:700;font-size:13.5px}
.fld{display:grid;gap:4px}
.fld label{font-size:13.5px;font-weight:700}
input,select,textarea{width:100%;border:1.5px solid var(--line-2);border-radius:12px;background:var(--bg);padding:9px 12px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--peri);outline:none;box-shadow:var(--focus)}
textarea{resize:vertical;line-height:1.9}
.ltr{direction:ltr;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--crimson);font-size:13.5px;min-height:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.kpi small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.kpi b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.5}
.kpi span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.kpi.g b{color:var(--green-600)}.kpi.a b{color:var(--amber-ink)}.kpi.c b{color:var(--crimson)}.kpi.s b{color:var(--sky-ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input{max-width:260px}.toolbar select{width:auto}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--sunken);white-space:nowrap}
.pill.g{background:var(--green-100);color:var(--green-600)}.pill.a{background:var(--amber-100);color:var(--amber-ink)}.pill.c{background:var(--crimson-100);color:#a3173f}.pill.p{background:var(--peri-100);color:var(--peri)}.pill.s{background:var(--sky-100);color:var(--sky-ink)}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:14px}
table.t th{background:var(--sunken);font-size:12.5px;color:var(--ink-2);text-align:right;padding:9px 10px;font-weight:700;white-space:nowrap}
table.t td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:#fafbff}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px}
.sub{display:block;font-size:12px;color:var(--muted)}
.cards{display:none}
@media(max-width:860px){table.t.resp{display:none}.cards{display:grid;gap:10px}}
.ccard{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px}
.ccard .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ccard .h b{font-size:16px}
.ccard .m{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12.5px;color:var(--ink-2)}
.ccard .m b{display:block;font-size:15px;color:var(--ink)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:90;box-shadow:var(--sh4);max-width:92vw}
.scrim{position:fixed;inset:0;background:rgba(32,34,60,.45);z-index:70}
.modal-wrap{position:fixed;inset:0;z-index:71;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--bg);border-radius:22px;padding:20px;width:100%;max-width:520px;box-shadow:var(--sh4);display:grid;gap:12px}
.modal h3{margin:0;font-size:19px}
.cred{background:var(--sunken);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:2;white-space:pre-line}
.cred b{font-size:18px;letter-spacing:.05em}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .card{width:100%;max-width:400px;padding:26px;display:grid;gap:14px}
.steps3{display:grid;gap:14px}
.fbl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;align-items:start}
@media(max-width:960px){.fbl{grid-template-columns:1fr}}
.fbitem{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:right;width:100%}
.fbitem[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fbitem b{font-size:14.5px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;direction:ltr;text-align:left}
.note{background:var(--sky-100);border-radius:14px;padding:10px 14px;font-size:13.5px;color:var(--ink-2)}
.warn{background:var(--amber-100);border-radius:14px;padding:10px 14px;font-size:13.5px;color:#7a5810}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.barrow .bt{height:10px;background:var(--sunken);border-radius:999px;overflow:hidden;position:relative}
.barrow .bt i{position:absolute;inset-block:0;right:0;border-radius:999px}
.menu{position:absolute;top:52px;left:16px;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh4);padding:6px;display:grid;min-width:180px;z-index:40}
.menu button{background:none;border:0;text-align:right;padding:8px 12px;border-radius:10px}
.menu button:hover{background:var(--sunken)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<div id="layer"></div>
<script>
'use strict';
const LOGO=`<svg class="logo" viewBox="230 190 860 260" role="img" aria-label="حرف نو"><path fill="#2FB57C" d="M949.88,198.4c-60.97,0-110.4,49.43-110.4,110.4v122.79h53.25l-.36-51.98v-72.02c0-31.82,25.79-57.61,57.61-57.61s57.61,25.79,57.61,57.61v72.02h-64.99l-23.94,51.98h141.62v-122.79c0-60.97-49.43-110.4-110.4-110.4Z"/><g fill="#30345A"><path d="M597.3,249.76c-35.63,0-64.62,28.99-64.62,64.62,0,14.11,4.56,27.17,12.27,37.81h-21.72c-18.71,0-33.93-15.22-33.93-33.93v-48.31c0-7.39-5.99-13.37-13.37-13.37s-13.37,5.99-13.37,13.37v48.31c0,33.46,27.22,60.68,60.68,60.68h71.94c.71.02,1.42.05,2.14.05,35.63,0,64.62-28.99,64.62-64.62s-28.99-64.62-64.62-64.62ZM597.3,352.25c-20.88,0-37.87-16.99-37.87-37.87s16.99-37.87,37.87-37.87,37.87,16.99,37.87,37.87-16.99,37.87-37.87,37.87Z"/><path d="M432.21,256.84c-7.39,0-13.37,5.99-13.37,13.37v48.31c0,18.71-15.22,33.93-33.93,33.93h-26.11c7.71-10.64,12.27-23.7,12.27-37.81,0-35.63-28.99-64.62-64.62-64.62s-64.62,28.99-64.62,64.62,28.99,64.62,64.62,64.62c.72,0,1.43-.03,2.14-.05h2.14l-15.1,33.78c-3.26,6.63-.52,14.64,6.11,17.9,1.9.93,3.91,1.37,5.89,1.37,4.94,0,9.69-2.75,12.01-7.48l20.89-45.58h44.38c33.46,0,60.68-27.22,60.68-60.68v-48.31c0-7.39-5.99-13.37-13.37-13.37ZM268.58,314.64c0-20.88,16.99-37.87,37.87-37.87s37.87,16.99,37.87,37.87-16.41,37.24-36.8,37.81h-2.14c-20.38-.57-36.8-17.29-36.8-37.81Z"/><path d="M742.28,250.02h-34.03c-7.39,0-13.37,5.99-13.37,13.37s5.99,13.37,13.37,13.37h34.03c20.88,0,37.87,16.99,37.87,37.87s-16.99,37.87-37.87,37.87h-55.55c-5.27,0-9.82,3.06-12,7.49-.38.55-.73,1.11-1.03,1.73l-23.36,51.06c-3.24,6.64-.5,14.65,6.14,17.89,1.89.93,3.89,1.36,5.87,1.36,4.95,0,9.71-2.76,12.03-7.5l20.81-45,47.1-.28c35.63,0,64.62-28.99,64.62-64.62s-28.99-64.62-64.62-64.62Z"/><circle cx="388.89" cy="217.39" r="19.27"/><circle cx="597.47" cy="217.39" r="19.27"/></g></svg>`;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FA=(n,d=0)=>{const x=Number(n)||0;return x.toLocaleString('fa-IR',{maximumFractionDigits:d,minimumFractionDigits:0})};
const FD=s=>String(s??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const toEn=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const when=t=>{if(!t)return '—';try{const d=new Date(t),diff=(Date.now()-d)/1000;if(diff<90)return 'همین الان';if(diff<3600)return FA(Math.round(diff/60))+' دقیقه پیش';if(diff<86400)return FA(Math.round(diff/3600))+' ساعت پیش';return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}catch(e){return '—'}};
const money=v=>v>=1000?FA(v/1000,1)+' میلیارد':v>=1?FA(v,v<10?1:0)+' میلیون':v>0?FA(Math.round(v*1000))+' هزار':'۰';

/* ---------- شبکه ---------- */
class NetErr extends Error{constructor(m,code,body){super(m);this.code=code;this.body=body}}
async function req(url,opt={},ms=30000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);let r;
 try{r=await fetch(url,{credentials:'same-origin',...opt,signal:c.signal})}catch(e){throw new NetErr(navigator.onLine===false?'اینترنت قطع است.':'سرور پاسخ نداد؛ اتصال را بررسی کنید.','offline')}finally{clearTimeout(t)}
 const j=await r.json().catch(()=>({}));
 if(r.status===401){if(!url.endsWith('/login'))showLogin('نشست شما تمام شده است؛ دوباره وارد شوید.');throw new NetErr(j.error||'وارد نشده‌اید.','auth')}
 if(!r.ok)throw new NetErr(j.error||'خطای سرور.','server',j);
 return j}
const JH={'Content-Type':'application/json'};
const api={
 me:()=>req('api/admin/me'),
 login:(u,p)=>req('api/admin/login',{method:'POST',headers:JH,body:JSON.stringify({username:u,password:p})}),
 logout:()=>req('api/admin/logout',{method:'POST'}),
 password:(a,b)=>req('api/admin/password',{method:'POST',headers:JH,body:JSON.stringify({current:a,next:b})}),
 users:()=>req('api/admin/users'),
 create:o=>req('api/admin/users',{method:'POST',headers:JH,body:JSON.stringify(o)}),
 importUsers:rows=>req('api/admin/users/import',{method:'POST',headers:JH,body:JSON.stringify({rows})}),
 patch:(id,o)=>req('api/admin/users/'+id,{method:'PATCH',headers:JH,body:JSON.stringify(o)}),
 reset:id=>req('api/admin/users/'+id+'/reset-password',{method:'POST'}),
 form:id=>req('api/admin/users/'+id+'/form'),
 saveFb:(id,draft)=>req('api/admin/users/'+id+'/feedback',{method:'PUT',headers:JH,body:JSON.stringify({draft})}),
 publish:id=>req('api/admin/users/'+id+'/feedback/publish',{method:'POST'}),
 unpublish:id=>req('api/admin/users/'+id+'/feedback/unpublish',{method:'POST'}),
 analyze:id=>req('api/admin/users/'+id+'/analyze',{method:'POST'},200000),
 importFb:text=>req('api/admin/feedback/import',{method:'POST',headers:JH,body:JSON.stringify({text})},60000)
};

/* ---------- وضعیت ---------- */
const S={me:null,users:[],tab:'counties',q:'',filter:'all',sort:'updated',fbSel:null,fbForm:null,loading:false};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,3200)}
function closeLayer(){$('#layer').innerHTML='';document.body.style.overflow=''}
function modal(html){$('#layer').innerHTML=`<div class="scrim" data-close></div><div class="modal-wrap"><div class="modal">${html}</div></div>`;document.body.style.overflow='hidden'}
const statusOf=u=>!u.active?['غیرفعال','']:u.submittedAt?(u.editedAfterSubmit?['ارسال‌شده، ویرایش بعد از ارسال','a']:['ارسال‌شده','g']):u.updatedAt?['در حال تکمیل','p']:['شروع‌نشده','c'];
const siteUrl=()=>(S.me&&S.me.publicUrl)||location.origin+'/';

/* ---------- ورود ---------- */
function showLogin(msg){closeLayer();$('#app').innerHTML=`<div class="auth"><form class="card" id="lf"><div>${LOGO}<h1 style="margin-top:12px">داشبورد ستاد</h1><p class="lead" style="margin:0">نقشهٔ هزار مشعل · بوم تحول آرایش نیروهای مجاهد تبیین</p></div>
 <div class="fld"><label for="u">نام کاربری</label><input id="u" class="ltr" autocomplete="username" autocapitalize="off"></div>
 <div class="fld"><label for="p">رمز</label><input id="p" type="password" class="ltr" autocomplete="current-password"></div>
 <div class="err" id="le">${esc(msg||'')}</div><button class="btn pr" type="submit">ورود</button></form></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;$('#le').textContent='';
  try{await api.login($('#u').value.trim(),$('#p').value);await boot()}catch(err){$('#le').textContent=err.message;b.disabled=false}};
 setTimeout(()=>$('#u')&&$('#u').focus(),50)}

async function boot(){try{S.me=await api.me()}catch(e){if(e.code==='auth')return showLogin();$('#app').innerHTML=`<div class="auth"><div class="card"><h2>به سرور وصل نشدیم</h2><p class="lead">${esc(e.message)}</p><button class="btn pr" onclick="location.reload()">دوباره تلاش کن</button></div></div>`;return}
 shell();await load()}
async function load(){S.loading=true;try{S.users=(await api.users()).users}catch(e){if(e.code!=='auth')toast(e.message)}S.loading=false;render()}

function shell(){$('#app').innerHTML=`<header class="bar"><div class="bar-in">${LOGO}<span class="ttl">داشبورد ستاد</span><span class="sp"></span><button class="btn se sm" data-refresh title="به‌روزرسانی" aria-label="به‌روزرسانی">↻<span class="rtx"> به‌روزرسانی</span></button><button class="btn se sm uname" data-menu><span>${esc(S.me.user.name)}</span> ▾</button></div></header>
 <nav class="tabs" role="tablist">${[['counties','شهرستان‌ها'],['users','مدیران و رمزها'],['feedback','تحلیل و بازخورد']].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</nav>
 <main class="wrap" id="main"></main>`}
function render(){$$('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));const m=$('#main');if(!m)return;
 m.innerHTML=S.tab==='counties'?countiesHTML():S.tab==='users'?usersHTML():feedbackHTML();if(S.tab==='feedback')bindFb()}

/* ---------- شهرستان‌ها ---------- */
function countiesHTML(){const us=S.users.filter(u=>u.active);
 if(!S.users.length)return `<h1>شهرستان‌ها</h1><div class="card empty">هنوز هیچ مدیری تعریف نشده است. از بخش «مدیران و رمزها» مدیران شهرستان‌ها را اضافه کنید.<div style="margin-top:12px"><button class="btn pr" data-tab="users">افزودن مدیران</button></div></div>`;
 const sum=k=>us.reduce((a,u)=>a+(u.metrics.gap[k]||0),0),tot=k=>us.reduce((a,u)=>a+(u.metrics.totals[k]||0),0);
 const started=us.filter(u=>u.updatedAt).length,sub=us.filter(u=>u.submittedAt).length,pub=us.filter(u=>u.feedback.published).length;
 const aT=sum('aT'),needA=sum('needA'),aI=sum('aI'),aNew=sum('aNew'),gapM=sum('gapM'),dA=tot('dA'),inv=tot('invited'),cost=tot('cost'),tgt=sum('tgtA');

function parseCsv(txt){const rows=[];let row=[],cur='',q=false;txt=String(txt||'').replace(/^﻿/,'');
 for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'&&txt[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===','||c==='،'||c==='\t'||c===';'){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
 if(cur||row.length){row.push(cur);rows.push(row)}
 const r=rows.filter(x=>x.some(y=>y.trim()));if(!r.length)return [];
 const head=r[0].map(h=>h.trim().toLowerCase());const names={name:['name','نام','نام و نام خانوادگی'],phone:['phone','موبایل','شماره','شمارهٔ همراه','شماره همراه','تلفن همراه'],county:['county','شهرستان'],province:['province','استان'],title:['title','سمت']};
 const idx=Object.fromEntries(Object.entries(names).map(([k,v])=>[k,head.findIndex(h=>v.includes(h))]));const hasHead=idx.phone>=0;
 const order=['name','phone','county','province','title'];
 return (hasHead?r.slice(1):r).map(x=>Object.fromEntries(order.map((k,j)=>{const i=hasHead?idx[k]:j;return [k,i>=0?(x[i]||'').trim():'']}))).filter(o=>o.phone||o.name)}

/* پس از بارگذاری یا انتشار گروهی، ویرایشگر باز همان شهرستان با دادهٔ تازه پر می‌شود */
async function refreshFb(){if(!S.fbSel)return;const id=S.fbSel;S.fbForm=null;try{const f=await api.form(id);if(S.fbSel!==id)return;S.fbForm=f;bindFb()}catch(e){}}
function bindFb(){if(S.fbSel&&S.fbForm&&S.fbForm.user.id===S.fbSel){const u=S.users.find(x=>x.id===S.fbSel),el=$('#fbed');if(u&&el)el.innerHTML=fbEditorHTML(u,S.fbForm)}}

/* ---------- رویدادها ---------- */
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='flt'){S.filter=t.value;render()}if(t.id==='srt'){S.sort=t.value;render()}
 if(t.id==='csvf'&&t.files[0]){$('#csv').value=await t.files[0].text();$('#csvinfo').textContent=FA(parseCsv($('#csv').value).length)+' ردیف خوانده شد.'}
 if(t.id==='fbfile'&&t.files[0]){$('#fbtext').value=await t.files[0].text()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='addf')return;e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;$('#adde').textContent='';
 try{const r=await api.create({name:$('#a_name').value,phone:$('#a_phone').value,county:$('#a_county').value,province:$('#a_prov').value,title:$('#a_title').value});await load();showCreds([r])}catch(err){$('#adde').textContent=err.message}b.disabled=false});
document.addEventListener('click',async e=>{
 if(!e.target.closest('.menu,[data-menu]'))$('.menu')?.remove();
 if(e.target.matches('[data-close]')){closeLayer();return}
 const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
 if(d.tab){S.tab=d.tab;render();window.scrollTo(0,0);return}
 if(d.refresh!==undefined){await load();toast('به‌روز شد.');return}
 if(d.menu!==undefined){if($('.menu'))return $('.menu').remove();const m=document.createElement('div');m.className='menu';m.innerHTML='<button data-adminpw>تغییر رمز من</button><button data-logout>خروج</button>';$('.bar').appendChild(m);return}
 if(d.logout!==undefined){await api.logout().catch(()=>{});showLogin();return}
 if(d.adminpw!==undefined){modal(`<h3>تغییر رمز حساب ستاد</h3><div class="fld"><label>رمز فعلی</label><input type="password" id="pw0" class="ltr"></div><div class="fld"><label>رمز تازه (دست‌کم ۱۰ نویسه)</label><input type="password" id="pw1" class="ltr"></div><div class="err" id="pwe"></div><div class="row"><button class="btn pr" data-pwsave>ذخیره</button><button class="btn se" data-close>انصراف</button></div>`);return}
 if(d.pwsave!==undefined){try{await api.password($('#pw0').value,$('#pw1').value);closeLayer();toast('رمز تازه ذخیره شد.')}catch(err){$('#pwe').textContent=err.message}return}
 if(d.fbopen){openFb(d.fbopen);return}
 if(d.fbsel){openFb(d.fbsel);return}
 if(d.reset){const u=S.users.find(x=>x.id===d.reset);modal(`<h3>رمز تازه برای ${esc(u.county)}</h3><p style="margin:0">رمز فعلی ${esc(u.name)} از کار می‌افتد و از همهٔ دستگاه‌ها خارج می‌شود.</p><div class="row"><button class="btn pr" data-resetok="${u.id}">ساختن رمز تازه</button><button class="btn se" data-close>انصراف</button></div>`);return}
 if(d.resetok){if(t.disabled)return;t.disabled=true;try{const r=await api.reset(d.resetok);showCreds([r])}catch(err){toast(err.message);t.disabled=false}return}
 if(d.toggle){const u=S.users.find(x=>x.id===d.toggle);try{await api.patch(u.id,{active:!u.active});await load();toast(u.active?'غیرفعال شد.':'فعال شد.')}catch(err){toast(err.message)}return}
 if(d.edit){const u=S.users.find(x=>x.id===d.edit);modal(`<h3>ویرایش مدیر</h3><div class="fld"><label>نام</label><input id="e_name" value="${esc(u.name)}"></div><div class="fld"><label>شمارهٔ همراه</label><input id="e_phone" class="ltr" value="${esc(u.phone)}"></div><div class="fld"><label>شهرستان</label><input id="e_county" value="${esc(u.county)}"></div><div class="fld"><label>استان</label><input id="e_prov" value="${esc(u.province)}"></div><div class="fld"><label>سمت</label><input id="e_title" value="${esc(u.role)}"></div><div class="err" id="ee"></div><div class="row"><button class="btn pr" data-editok="${u.id}">ذخیره</button><button class="btn se" data-close>انصراف</button></div>`);return}
 if(d.editok){try{await api.patch(d.editok,{name:$('#e_name').value,phone:$('#e_phone').value,county:$('#e_county').value,province:$('#e_prov').value,title:$('#e_title').value});closeLayer();await load();toast('ذخیره شد.')}catch(err){$('#ee').textContent=err.message}return}
 if(d.import!==undefined){const rows=parseCsv($('#csv').value);if(!rows.length)return toast('ردیفی برای ساختن نیست.');t.disabled=true;
  try{const r=await api.importUsers(rows);await load();if(r.created.length){showCreds(r.created,r.errors);$('#csv').value=''}else if(r.errors.length){modal(`<h3>هیچ مدیری ساخته نشد</h3><div class="cred">${esc(r.errors.map(x=>`ردیف ${FA(x.row)}: ${x.error}`).join('\n'))}</div><button class="btn se" data-close>بستن</button>`)}}catch(err){toast(err.message)}t.disabled=false;return}
 if(d.copycred!==undefined){try{await navigator.clipboard.writeText($('#credt').innerText);toast('کپی شد.')}catch(err){toast('کپی نشد؛ متن را انتخاب و کپی کنید.')}return}
 if(d.dlcred!==undefined){const csv='﻿شهرستان,نام,شمارهٔ همراه,رمز موقت,متن پیام\n'+S._creds.map(x=>[x.user.county,x.user.name,x.user.phone,x.password,credText(x.user,x.password).replace(/\n/g,' | ')].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='harfeno-passwords.csv';a.click();return}
 if(d.copyprompt!==undefined){try{await navigator.clipboard.writeText($('#prompt').innerText);toast('کپی شد.')}catch(err){toast('کپی نشد.')}return}
 if(d.fbimport!==undefined){const txt=$('#fbtext').value.trim();if(!txt)return toast('اول خروجی Claude را جای‌گذاری کنید.');t.disabled=true;
  try{const r=await api.importFb(txt);await load();refreshFb();$('#fbres').innerHTML=`<div class="note">${FA(r.matched.length)} بازخورد به‌صورت پیش‌نویس ذخیره شد${r.matched.length?': '+r.matched.map(x=>esc(x.county)).join('، '):''}.</div>${r.unmatched.length?`<div class="warn">${FA(r.unmatched.length)} مورد با هیچ مدیری جور نشد: ${r.unmatched.map(x=>esc(x.county||('ردیف '+FA(x.idx+1)))).join('، ')}</div>`:''}`}catch(err){$('#fbres').innerHTML=`<div class="warn">${esc(err.message)}</div>`}t.disabled=false;return}
 if(d.fbsave||d.fbpub){const id=d.fbsave||d.fbpub;t.disabled=true;try{await api.saveFb(id,readFb());if(d.fbpub){await api.publish(id);toast('بازخورد برای مدیر منتشر شد.')}else toast('پیش‌نویس ذخیره شد.');await load();S.fbForm=null;openFb(id)}catch(err){toast(err.message)}t.disabled=false;return}
 if(d.fbunpub){try{await api.unpublish(d.fbunpub);await load();S.fbForm=null;openFb(d.fbunpub);toast('از انتشار برداشته شد.')}catch(err){toast(err.message)}return}
 if(d.ai){t.disabled=true;t.textContent='در حال تحلیل… (تا چند دقیقه)';try{await api.analyze(d.ai);await load();S.fbForm=null;openFb(d.ai);toast('پیش‌نویس Claude آماده شد؛ بازبینی و منتشر کنید.')}catch(err){toast(err.message);t.disabled=false;t.textContent='پیش‌نویس با Claude'}return}
 if(d.pubpending!==undefined){const ids=S.users.filter(u=>u.active&&u.feedback.draft&&(!u.feedback.published||(u.feedback.draftAt>u.feedback.publishedAt))).map(u=>u.id);
  modal(`<h3>انتشار ${FA(ids.length)} بازخورد</h3><p style="margin:0">همهٔ پیش‌نویس‌های تازه برای مدیرانشان منتشر می‌شود. مطمئن هستید همه را بازبینی کرده‌اید؟</p><div class="row"><button class="btn pr" data-pubok>انتشار همه</button><button class="btn se" data-close>انصراف</button></div>`);S._pub=ids;return}
 if(d.pubok!==undefined){t.disabled=true;let n=0;for(const id of S._pub){try{await api.publish(id);n++}catch(err){}}closeLayer();await load();refreshFb();toast(FA(n)+' بازخورد منتشر شد.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLayer();$('.menu')?.remove()}});
boot();
</script>
</body>
</html>
