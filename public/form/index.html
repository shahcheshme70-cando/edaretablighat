<meta charset="utf-8">
<title>نقشهٔ هزار مشعل</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#30345a">
<style>
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-Regular.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-Medium.woff") format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-SemiBold.woff") format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-Bold.woff") format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"Ravagh";src:url("fonts/RavaghFaNum-ExtraBold.woff") format("woff");font-weight:800;font-display:swap}
/* Layout: one question per screen. A calm single column (max 640px) with a four-part progress rail on top and a sticky «بعدی» bar at the bottom. The gap is the visual anchor: two 100-dot grids. The bom shape lives in a separate «نمای بوم» page that shows the filled canvases like the printed sheets. حرف نو system: white, navy ink, one green action, pills, Ravagh. Light only. */
:root{
  color-scheme:light;
  --bg:#ffffff; --sunken:#f4f5f8; --ink:#30345a; --ink-2:#555a7d; --muted:#81859f; --line:#eaeaea; --line-2:#dcdee7;
  --green:#2fb57c; --green-600:#23905f; --green-100:#e3f5ec;
  --peri:#6e7fd9; --peri-100:#eceffb; --amber:#e8ae30; --amber-100:#fcf3de; --amber-ink:#87610f; --crimson:#db2a58; --crimson-100:#fbe5ec; --sky:#40bbe7; --sky-100:#e2f4fb; --sky-ink:#13739d;
  --focus:0 0 0 3px rgba(110,127,217,.35);
  --sh1:0 1px 2px rgba(48,52,90,.05),0 2px 8px rgba(48,52,90,.05);
  --sh2:0 8px 24px rgba(48,52,90,.10);
  --sh4:0 24px 64px rgba(48,52,90,.24);
  --out:cubic-bezier(.16,.84,.44,1);
  --font:"Ravagh","Vazirmatn","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--sunken)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.85;direction:rtl;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
[hidden]{display:none!important}
.muted{color:var(--muted)} .req{color:var(--crimson)} .opt{font-weight:400;color:var(--muted);font-size:12.5px}
.hint{font-size:13px;color:var(--muted);line-height:1.8}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:980px;margin:0 auto;padding-inline:16px;height:58px;display:flex;align-items:center;gap:12px}
.logo{height:28px;width:auto;display:block;flex:0 0 auto}
.bar .sp{flex:1}
.save{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.save.ok i{background:var(--green)} .save.busy i{background:var(--amber)} .save.err i{background:var(--crimson)}
.save.err{color:var(--crimson)}
.tb{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:var(--bg);font-size:13.5px;font-weight:600;color:var(--ink)}
.tb:hover{background:var(--sunken)}
.tb svg{width:17px;height:17px;color:var(--ink-2)}
.tb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tb[aria-pressed="true"] svg{color:#fff}
.av{width:36px;height:36px;border-radius:50%;background:var(--green-100);color:var(--green-600);display:grid;place-items:center;font-weight:800;font-size:13px;border:0}
.menu{position:absolute;top:56px;left:16px;width:250px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);padding:8px;z-index:35;animation:pop .18s var(--out)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block}
.menu .who span{font-size:12.5px;color:var(--muted)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;border-radius:12px;padding:9px 12px;font-size:14px;text-align:right}
.menu button:hover{background:var(--sunken)}
.menu svg{width:18px;height:18px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
@media (max-width:560px){.save span{display:none}.tb{padding:0 10px;font-size:12.5px;gap:4px}.bar .logo{height:26px}}
@media (max-width:340px){.tb .lbl{display:none}}

/* ---------- progress rail ---------- */
.rail{max-width:640px;margin:0 auto;padding:18px 16px 0}
.pulse{animation:pulse 1.7s ease-out infinite;position:relative;z-index:1}
input.pulse,textarea.pulse,select.pulse{border-color:var(--green)!important;background:#f3fbf7}
.seg.pulse,.choices.pulse,.chips .pulse,.cand .pulse{border-radius:16px}
.seg.pulse,.choices.pulse{outline:2px dashed var(--green);outline-offset:5px}
.move .mh.pulse{background:var(--green-100);border-radius:20px}
.btn.pulse{animation:pulseb 1.7s ease-out infinite}
input.pulse:focus,textarea.pulse:focus{animation:none;box-shadow:0 0 0 3px var(--green-100)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,181,124,.55)}70%{box-shadow:0 0 0 10px rgba(47,181,124,0)}100%{box-shadow:0 0 0 0 rgba(47,181,124,0)}}
@keyframes pulseb{0%{box-shadow:0 0 0 0 rgba(47,181,124,.6)}70%{box-shadow:0 0 0 12px rgba(47,181,124,0)}100%{box-shadow:0 0 0 0 rgba(47,181,124,0)}}
@media (prefers-reduced-motion:reduce){.pulse,.btn.pulse{animation:none;box-shadow:0 0 0 3px var(--green)}}
.jump{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:8px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;box-shadow:0 6px 18px rgba(47,181,124,.35);animation:pulseb 1.7s ease-out infinite}
.jump b{font-size:16px}
.fdone{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--bg);border:1px solid var(--line-2);border-radius:18px;padding:12px 14px}
.fdone .ok{width:28px;height:28px;border-radius:50%;background:var(--green-100);color:var(--green-600);display:grid;place-items:center;font-weight:800;flex:none}
.fdone .fn{flex:1;min-width:0;display:grid;gap:2px}
.fdone .fn b{font-size:15px}
.fdone .fn small{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.fdone .fn small .i{width:8px;height:8px;border-radius:50%;display:inline-block}
.fdone .ed{font-size:13px;font-weight:700;color:var(--green-600)}
.viewbar{position:sticky;top:calc(59px + env(safe-area-inset-top,0px));z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto;padding:10px 16px;background:rgba(244,245,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.viewbar .back{background:var(--green);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;min-height:40px}
.viewbar span{font-size:13px;color:var(--muted);font-weight:700}
.actq{margin-top:6px;font-size:13.5px}
.actq summary{cursor:pointer;color:var(--peri);font-weight:600;line-height:1.8;list-style:none}
.actq summary::before{content:'＋ '}
.actq[open] summary::before{content:'－ '}
.actq .fld{margin-top:8px}
.instr p b{color:#fff}
.north.compact .nt>small,.north.compact .nbar{display:none}
.north.compact .north-in{padding:7px 12px}
.sheetbox.fluid{overflow:visible;height:auto!important}
.sheetbox.fluid .sheet{width:auto;min-height:0;transform:none!important;padding:20px 14px 64px;border-radius:18px}
.sheetbox.fluid .bh h2{font-size:24px}.sheetbox.fluid .bh p{font-size:14px}
.sheetbox.fluid .bgrid{grid-template-columns:1fr;gap:22px}
.sheetbox.fluid .b2c{grid-template-columns:1fr 1fr;gap:4px 14px}
.sheetbox.fluid .bsec h3{font-size:18px}
.sheetbox.fluid .bt-t{display:block;overflow-x:auto;max-width:100%;white-space:normal}
.sheetbox.fluid .bgrid>.col,.sheetbox.fluid .bsec,.sheetbox.fluid .binfo{min-width:0}
.sheetbox.fluid td.st .cb:not(.on){display:none}
.sheetbox.fluid .bsec[data-go="forces"] .bt-t th:last-child,.sheetbox.fluid .bsec[data-go="forces"] .bt-t td:last-child{display:none}
.sheetbox.fluid .bt-t td,.sheetbox.fluid .bt-t th{padding:5px 6px}
.sheetbox.fluid .bt-t td.st{white-space:normal}
.sheetbox.fluid .bt-t td.st .cb{margin-inline-end:6px}
.sheetbox.fluid .byn>span:first-child{min-width:0;flex-basis:100%}
@media (max-width:420px){.part span{font-size:10.5px}.parts{gap:4px}.rail{padding-top:14px}}
.north{position:sticky;top:calc(59px + env(safe-area-inset-top,0px));z-index:20;max-width:640px;margin:12px auto 0;padding:0 16px}
.north-in{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:right;background:#30345a;color:#fff;border:0;border-radius:16px;padding:10px 14px;box-shadow:0 6px 18px rgba(48,52,90,.18)}
.north .ns{color:#e8ae30;font-size:20px;line-height:1.3}
.north .nt{flex:1;min-width:0;display:grid;gap:3px}
.north small{font-size:11.5px;opacity:.8}
.north b{font-size:13.5px;line-height:1.65}
.north b i{font-style:normal;opacity:.75;font-weight:600}
.nbar{height:5px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;display:block}
.nbar span{display:block;height:100%;background:#e8ae30;border-radius:999px}
.btn svg{width:18px;height:18px;flex:none}
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.part{background:none;border:0;padding:0;text-align:right;display:grid;gap:6px}
.part .ln{height:5px;border-radius:999px;background:var(--line-2);overflow:hidden;position:relative}
.part .ln i{position:absolute;inset-block:0;right:0;background:var(--green);border-radius:999px;transition:width .3s}
.part span{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part.cur span{color:var(--ink)}
.part.cur .ln{background:#c9ccd9}

/* ---------- step ---------- */
.wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.step{animation:rise .26s var(--out)}
@keyframes rise{from{opacity:.3;transform:translateY(8px)}}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--peri);letter-spacing:.02em}
.step h1{font-size:26px;font-weight:800;line-height:1.5;margin:4px 0 8px;text-wrap:balance}
.lead{color:var(--ink-2);font-size:15px;margin:0 0 20px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh1)}
.stack{display:grid;gap:14px}
.gap16{display:grid;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lb{font-size:14.5px;font-weight:600}
input,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;font-size:16px;min-height:48px;transition:border-color .14s,box-shadow .14s}
input:hover,select:hover,textarea:hover{border-color:#c4c7d6}
input:focus,select:focus,textarea:focus{border-color:var(--peri);box-shadow:var(--focus)}
textarea{resize:vertical;line-height:1.95;min-height:110px}
input.n{font-variant-numeric:tabular-nums}
input.big{font-size:24px;font-weight:700;min-height:60px;text-align:center}
::placeholder{color:#a9acc1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g3 .fld>label{font-size:13px;color:var(--ink-2)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:0 14px;min-height:40px;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg .i{width:8px;height:8px;border-radius:50%}
.seg button[aria-pressed="true"] .i{background:#fff!important}
.s-قوی{background:var(--green)} .s-متوسط{background:var(--sky)} .s-ضعیف{background:var(--amber)} .s-بلااستفاده{background:var(--crimson)} .s-{background:var(--line-2)}
.st4 button[data-v="قوی"][aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.st4 button[data-v="متوسط"][aria-pressed="true"]{background:var(--sky);border-color:var(--sky)}
.st4 button[data-v="ضعیف"][aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.st4 button[data-v="بلااستفاده"][aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson)}
.pick button[aria-pressed="true"]{background:var(--peri-100);border-color:var(--peri);color:var(--ink);font-weight:600}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-2);border-radius:18px;padding:13px 15px;background:var(--bg);text-align:right;width:100%}
.choice:hover{border-color:#c4c7d6}
.choice[aria-pressed="true"]{border-color:var(--green);background:var(--green-100);box-shadow:0 0 0 1px var(--green)}
.choice .rd{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);margin-top:4px;display:grid;place-items:center;background:var(--bg)}
.choice[aria-pressed="true"] .rd{border-color:var(--green)}
.choice[aria-pressed="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--green)}
.choice b{display:block;font-size:15.5px}
.choice span span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.8}
.choices{display:grid;gap:8px}

.item{border:1px solid var(--line-2);border-radius:20px;padding:14px;display:grid;gap:12px;background:var(--bg)}
.item-h{display:flex;align-items:center;gap:8px}
.item-h input{flex:1;font-weight:700}
.idx{font-size:12px;color:var(--muted);font-weight:700;min-width:18px;text-align:center}
.del{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:0 0 auto}
.del:hover{background:var(--crimson-100);color:var(--crimson)}
.del svg{width:18px;height:18px}
.add{border:1.5px dashed var(--line-2);background:none;border-radius:18px;min-height:52px;font-size:15px;font-weight:600;color:var(--ink-2);width:100%}
.add:hover{border-color:var(--green);color:var(--green-600);background:var(--green-100)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-2);background:var(--sunken);border-radius:999px;padding:0 12px;min-height:34px;font-size:13.5px;color:var(--ink-2)}
.chips button:hover{border-color:var(--green);color:var(--green-600)}
.tally{position:sticky;top:66px;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.tally>div{border-radius:16px;padding:8px 14px;box-shadow:var(--sh2);display:flex;flex-direction:column;line-height:1.5}
.tally .ta{background:var(--green);color:#fff}.tally .tm{background:var(--sky);color:#fff}
.tally b{font-size:20px;font-weight:800}
.ftot{display:flex;flex-wrap:wrap;gap:4px 16px;background:var(--sunken);border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ftot .ta b{color:var(--green-600)} .ftot .tm b{color:var(--sky-ink)}
.cat{display:grid;gap:8px}
.cat+.cat{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.cat-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.kind{font-size:11.5px;font-weight:600;border-radius:999px;padding:0 9px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.instr{display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;font-size:14.5px;font-weight:600;margin-bottom:12px}
.instr span{width:26px;height:26px;border-radius:8px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.tally .sm{font-size:12px;opacity:.92}

.note{background:var(--sky-100);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.note b{color:var(--ink)}
.from{background:var(--peri-100);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.from small{display:block;font-size:12px;font-weight:700;color:var(--peri)}
details.ex{background:var(--amber-100);border-radius:16px;padding:0 14px;font-size:14px;color:var(--ink-2)}
details.ex summary{cursor:pointer;font-weight:600;color:var(--amber-ink);padding:10px 0;list-style:none}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::before{content:"+ "}
details.ex[open] summary::before{content:"− "}
details.ex>div{padding:0 0 12px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:0;background:var(--peri-100);color:var(--ink);border-radius:10px;padding:7px 12px;min-height:38px;font-size:13px;text-align:right;line-height:1.7}
.sugg button::before{content:"+ ";color:var(--peri);font-weight:800}
.check{display:flex;gap:10px;align-items:center;font-weight:600;border:1px solid var(--line-2);border-radius:16px;padding:13px 15px;cursor:pointer;background:var(--bg)}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--green);flex:0 0 auto}
.check:has(input:checked){border-color:var(--green);background:var(--green-100)}

/* ---------- gap visual ---------- */
.need{text-align:center;padding:22px 18px}
.need .nk{font-size:13.5px;color:var(--ink-2)}
.need{border-radius:20px}
.need .nk{font-weight:700}
.need.n-act{background:var(--green-100)}.need.n-act .v,.need.n-act .nk{color:var(--green-600)}
.need.n-aud{background:var(--sky-100)}.need.n-aud .v,.need.n-aud .nk{color:var(--sky-ink)}
.need .v{font-size:34px;font-weight:800;line-height:1.4;font-variant-numeric:tabular-nums}
.need .v small{font-size:15px;font-weight:600;color:var(--ink-2)}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gapcard{display:grid;gap:12px}
.gapcard.g-act{border-top:4px solid var(--green)}.gapcard.g-aud{border-top:4px solid var(--sky)}.gapcard.g-plan{border-top:4px solid var(--amber)}
.gapcard.g-act h3,.gapcard.g-act .gapline b{color:var(--green-600)}.gapcard.g-aud h3,.gapcard.g-aud .gapline b{color:var(--sky-ink)}.gapcard.g-plan h3,.gapcard.g-plan .gapline b{color:var(--amber-ink)}
.gapcard h3{margin:0;font-size:17px;line-height:1.6}
.gapline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:14px;color:var(--ink-2)}
.gapline b{font-size:22px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:5px;direction:rtl}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line-2)}
.dots i.have{background:var(--green);box-shadow:none}
.dots.aud i.have{background:var(--sky)}
.dots i.add{background:var(--amber);box-shadow:none}
.dots i.inv{background:var(--green-100);box-shadow:inset 0 0 0 2px var(--green)}
.three{display:grid;gap:8px}
.three>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;background:var(--sunken)}
.three i{width:14px;height:14px;border-radius:50%;display:block}
.three b{font-size:18px;font-variant-numeric:tabular-nums}
.three small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.7}
.three .r-act b{color:var(--green-600)} .three .r-inv{background:var(--green-100)} .three .r-inv b{color:var(--green-600)}
.three .r-new{background:var(--crimson-100)} .three .r-new b{color:var(--crimson)} .three .r-aud{background:var(--sky-100)} .three .r-aud b{color:var(--sky-ink)}
.three .do{font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;margin-inline-start:6px;background:#fff}
.story h1{font-size:25px;line-height:1.6}
.story .say{font-size:16.5px;line-height:2.05;color:var(--ink);margin:0 0 16px}
.story .say b{color:var(--ink)}
.qt{position:relative;background:var(--peri-100);border-radius:20px;padding:18px 18px 14px;margin:4px 0 16px}
.qt p{margin:0;font-size:16px;line-height:2.05;font-weight:600;color:var(--ink)}
.qt small{display:block;margin-top:8px;font-size:12.5px;color:var(--peri);font-weight:600}
.torch{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;direction:rtl}
.torch i{aspect-ratio:1;border-radius:50%;background:var(--sky-100);box-shadow:inset 0 0 0 1px var(--line-2)}
.torch i.lit{background:var(--sky)} .torch i.me{background:var(--green);box-shadow:0 0 0 3px var(--green-100)}
.torch i.off{background:var(--sunken)}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.chain b{font-size:22px;color:var(--ink)}
.ways{display:grid;gap:10px}
.ways>div{border-radius:18px;padding:14px 16px;display:grid;gap:4px}
.ways b{font-size:16.5px} .ways span{font-size:14px;color:var(--ink-2);line-height:1.9}
.ways .w1{background:var(--green-100);box-shadow:inset 0 0 0 2px var(--green)} .ways .w1 b{color:var(--green-600)}
.ways .w2{background:var(--green)} .ways .w2 b,.ways .w2 span{color:#fff}
.ways .w3{background:var(--sky-100)} .ways .w3 b{color:var(--sky-ink)}
.ways .n{font-size:12px;font-weight:800;opacity:.8}
.dots i.tgt{box-shadow:inset 0 0 0 2px var(--peri)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.big-say{font-size:17px;font-weight:700;line-height:1.8;margin:0}
.big-say em{font-style:normal;color:#fff;background:var(--crimson);border-radius:10px;padding:0 10px}

/* ---------- moves ---------- */
.move{border:1px solid var(--line-2);border-radius:20px;background:var(--bg);overflow:hidden}
.move>button.mh{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 16px;text-align:right}
.move .mn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-weight:800;font-size:14px}
.move .mt{flex:1;min-width:0}
.move .mt b{display:block;font-size:16px}
.move .mt span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.move .cnt{font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--green-100);color:var(--green-600);white-space:nowrap}
.move .cnt.z{background:var(--sunken);color:var(--muted)}
.move .mb{padding:0 16px 16px;display:grid;gap:10px}
.move .mwhat{margin:0;font-size:14.5px;line-height:2;color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs>div{border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.85}
.vs small{display:block;font-weight:800;font-size:12px;margin-bottom:2px}
.vs .v-p{background:var(--sunken);color:var(--ink-2)} .vs .v-p small{color:var(--muted)}
.vs .v-t{background:var(--green-100);color:var(--ink)} .vs .v-t small{color:var(--green-600)}
.waygrp{margin-top:16px;display:grid;gap:10px}
.wg-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:14px}
.wg-h b{font-size:15.5px} .wg-h span{font-size:12.5px;font-weight:700}
.waygrp.w1 .wg-h{background:var(--green-100);box-shadow:inset 0 0 0 2px var(--green)} .waygrp.w1 .wg-h b,.waygrp.w1 .wg-h span{color:var(--green-600)}
.waygrp.w2 .wg-h{background:var(--green)} .waygrp.w2 .wg-h b,.waygrp.w2 .wg-h span{color:#fff}
.waygrp.w3 .wg-h{background:var(--sky-100)} .waygrp.w3 .wg-h b,.waygrp.w3 .wg-h span{color:var(--sky-ink)}
.verdict{border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.verdict b{font-size:16.5px} .verdict p{margin:0;font-size:14px;line-height:1.95;color:var(--ink-2)}
.verdict.bad{background:var(--crimson-100)} .verdict.bad>b{color:var(--crimson)}
.verdict.good{background:var(--green-100)} .verdict.good>b{color:var(--green-600)}
.fix{background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.9}
.fix small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.row-btn{display:flex;gap:8px;flex-wrap:wrap}
.sc{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.sc:last-child{border-bottom:0}
.sc i{width:12px;height:12px;border-radius:50%;margin-top:7px;display:block}
.sc.ok i{background:var(--green)} .sc.mid i{background:var(--amber)} .sc.no i{background:var(--crimson)}
.sc span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.sc b{font-size:16px} .sc small{display:block;font-size:13px;color:var(--ink-2);line-height:1.8}
.split{display:flex;gap:6px;flex-wrap:wrap}
.split span{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px}
.split .s-inv{background:var(--green-100);color:var(--green-600);box-shadow:inset 0 0 0 1.5px var(--green)} .split .s-new{background:var(--green);color:#fff}
.costs{display:grid;grid-template-columns:1fr 120px;gap:8px 10px;align-items:center}
.costs label{font-size:14.5px;font-weight:600}
.road{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.road{grid-template-columns:repeat(4,1fr)}}
.road .q{border:1.5px dashed var(--line-2);border-radius:14px;padding:8px 10px;display:grid;gap:4px;min-height:62px;align-content:start}
.road .q small{font-size:11.5px;color:var(--muted);font-weight:700}
.road .q span{font-size:13px;color:var(--muted)}
.road .q.on{border:0;background:var(--amber-100)}
.road .q button{background:none;border:0;padding:0;text-align:right;font-size:13.5px;font-weight:700;color:var(--amber-ink);line-height:1.7}
.stg{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.stg .sn{width:28px;height:28px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:4px}
.move .exm{font-size:13.5px;color:var(--ink-2);background:var(--amber-100);border-radius:14px;padding:10px 12px}
.move .exm b{color:var(--amber-ink)}
.move.open{border-color:var(--ink)}
.move.chosen{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.cand{display:flex;align-items:center;gap:10px;background:var(--sunken);border-radius:14px;padding:10px 12px}
.cand span{flex:1;min-width:0;font-size:14px}
.cand small{display:block;font-size:12.5px;color:var(--muted);line-height:1.7}
.cand button{white-space:nowrap}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{text-align:right;font-weight:700;padding:6px 8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.cmp td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td:last-child{color:var(--green-600);font-weight:600}

.sentence{background:var(--sunken);border-radius:16px;padding:14px 16px}
.sentence small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sentence p{margin:0;font-size:16px;font-weight:600;line-height:1.95}
.ba{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center}
.ba .hd{font-size:12.5px;color:var(--muted);font-weight:600}
.ba .rl{font-weight:700}
.impact{background:var(--amber-100);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.impact .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.impact b{font-size:24px;font-weight:800;color:var(--amber-ink);font-variant-numeric:tabular-nums}
.impact span{font-size:14px;color:var(--ink-2)}
.yn{border:1px solid var(--line-2);border-radius:18px;padding:14px;display:grid;gap:8px;background:var(--bg)}
.yn b{font-size:15px;line-height:1.7}
.yn>span{font-size:13px;color:var(--muted)}
.warn{background:var(--amber-100);border-radius:16px;padding:12px 14px;font-size:14px;color:#7a5810}
.stage{border:1px solid var(--line-2);border-radius:22px;padding:14px;display:grid;gap:12px;background:var(--bg)}
.stage-h{display:flex;gap:10px;align-items:center}
.stage-h .sn{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.stage-h b{display:block;font-size:15.5px;line-height:1.5}
.stage-h small{display:block;font-size:12.5px;color:var(--muted)}
.act{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;background:var(--sunken);border-radius:16px;padding:8px}
.act .a1{grid-column:1/3}
.act .dl{grid-row:1;grid-column:3}
.act input,.act select{min-height:44px;font-size:15px}

/* ---------- bottom bar ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .pos{flex:1;font-size:12.5px;color:var(--muted);text-align:center}
.btn{border:0;border-radius:999px;padding:0 24px;height:48px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .14s,transform .1s}
.btn:active{transform:scale(.985)}
.btn.pr{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(47,181,124,.3)}
.btn.pr:hover{background:var(--green-600)}
.btn.pr:disabled{background:#b8c9c0;box-shadow:none;cursor:not-allowed}
.btn.se{background:var(--bg);border:1px solid var(--line-2);color:var(--ink)}
.btn.se:hover{background:var(--sunken)}
.btn.sm{height:38px;padding:0 16px;font-size:14px;font-weight:600}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--green-600);font-weight:700;font-size:14px;padding:0}

/* ---------- bom view ---------- */
.bomwrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.bom-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;margin-bottom:14px}
.bom-h h1{margin:0;font-size:26px;font-weight:800;line-height:1.45}
.w8{background:var(--amber-100);color:var(--amber-ink);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.8;width:100%}
.w8::before{content:'⚠ '}
.net{position:fixed;inset-inline:12px;bottom:88px;z-index:60;background:#30345a;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px;line-height:1.8;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:560px;margin:0 auto}
.net span{flex:1}
.net button{background:#fff;color:#30345a;border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.sheetbox{position:relative;margin-bottom:18px;overflow:hidden}
.sheetbox.zoom{overflow-x:auto;height:auto!important}
.sheetbox.zoom .sheet{transform:none!important}
.sheet{width:1400px;min-height:990px;background:#fff;color:#1d1f2e;border:1px solid var(--line);box-shadow:var(--sh1);padding:34px 40px 70px;position:relative;transform-origin:top right;font-size:14px}
.bh{text-align:center;margin-bottom:18px;color:#8d90a4}
.bh h2{margin:0;font-size:34px;font-weight:900;color:#1d1f2e;letter-spacing:.01em}
.bh p{margin:2px 0 4px;font-size:19px;color:#8d90a4}
.bh svg{width:120px;height:16px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.bgrid .col{display:grid;gap:22px}
.binfo{position:relative;padding:14px 18px 12px 0;cursor:pointer}
.binfo::before{content:'';position:absolute;top:0;right:0;width:46px;height:28px;border-top:2px solid #c9cbd6;border-right:2px solid #c9cbd6}
.binfo::after{content:'';position:absolute;bottom:0;left:0;width:46px;height:28px;border-bottom:2px solid #c9cbd6;border-left:2px solid #c9cbd6}
.binfo .bt{font-size:19px;font-weight:900;margin-bottom:8px}
.b2c{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.b2c small,.bline small,.bl{display:block;font-size:13px;font-weight:800;color:#3c3f55;margin-top:6px}
.b2c small::before,.bline small::before,.bl::before{content:'◂ ';color:#9a9db0;font-size:10px}
.kvl{font-size:13.5px;margin:2px 0}
.bsec{position:relative;padding:12px 16px 0 0;cursor:pointer;border-radius:6px}
.bsec::before{content:'';position:absolute;top:0;right:0;width:46px;height:28px;border-top:2px solid #c9cbd6;border-right:2px solid #c9cbd6}
.bsec:hover{background:#fafbff}
.bsec h3{margin:0 0 4px;font-size:21px;font-weight:900;display:flex;gap:6px;align-items:baseline}
.bsec h3 span::after{content:'.'}
.bsub{margin:0 0 10px;color:#7b7e93;font-size:13.5px;line-height:1.9}
.bq{margin:0 0 8px;font-size:14.5px;line-height:2;color:#2c2f45;border-right:3px solid #c9cbd6;padding-right:10px}
.bt-t{width:100%;border-collapse:collapse;border:1.5px solid #3a3d52;font-size:13px}
.bt-t thead th{background:#8a8c99;color:#fff;font-weight:700;padding:8px 6px;border-left:1px solid #fff;text-align:center}
.bt-t thead tr th:first-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.bt-t td,.bt-t th.rh{border:1px solid #3a3d52;padding:6px 8px;vertical-align:middle;height:34px}
.bt-t th.rh{background:#8a8c99;color:#fff;font-weight:700;text-align:center;width:120px}
.bt-t td.n{text-align:center;font-variant-numeric:tabular-nums;color:var(--peri);font-weight:700}
.bt-t td.nm{font-weight:700;color:var(--peri)}
.bt-t td.sm{font-size:12px;color:#5b5e74}
.bt-t td.st{white-space:nowrap}
.bt-t td.tall{height:110px;vertical-align:top;line-height:1.9}
.cb{display:inline-flex;align-items:center;gap:4px;margin-inline-end:10px;font-size:12.5px;color:#3c3f55;line-height:1.9}
.cb i{width:12px;height:12px;border:1.5px solid #3a3d52;border-radius:3px;display:inline-block;flex:none;position:relative}
.cb.on{color:#1d1f2e;font-weight:700}
.cb.on i{background:var(--green);border-color:var(--green)}
.cb.on i::after{content:'';position:absolute;left:3px;top:0;width:3px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.binfo .cb{display:flex}
.pen{color:var(--peri);font-weight:700;line-height:1.9}
.pen.sm,div.pen.sm{font-size:12.5px;font-weight:600}
.blank{display:block;border-bottom:1.5px dotted #b5b7c4;height:24px}
.bline{margin-top:8px;line-height:1.9}
.bline .cb{display:flex}
.btot,.bgap{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.btot b{color:var(--peri)}
.bgap span{border-radius:999px;padding:2px 12px;font-weight:700;font-size:12.5px}
.bgap .w1{background:var(--green-100);color:var(--green-600);box-shadow:inset 0 0 0 1.5px var(--green)}
.bgap .w2{background:var(--green);color:#fff}
.bgap .w3{background:var(--sky-100);color:var(--sky-ink)}
.bgap .w4{background:var(--amber-100);color:var(--amber-ink)}
.bway{margin-bottom:10px}
.bway>small{display:block;font-size:12.5px;font-weight:800;color:#7b7e93;margin-bottom:2px}
.bmove{padding:3px 6px;border-radius:8px}
.bmove .cb{font-size:13.5px;display:flex;align-items:flex-start}
.bmove .cb i{margin-top:6px}
.bmove.on{background:var(--green-100)}
.byn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 0;border-bottom:1px dotted #c9cbd6;font-size:13.5px}
.byn>span:first-child{flex:1;min-width:220px}
.bverdict{margin-top:10px;padding:8px 12px;border-radius:8px;background:#f2f3f7;font-size:13.5px}
.bverdict.ok{background:var(--green-100);color:var(--green-600);font-weight:700}
.bverdict.no{background:var(--crimson-100);color:var(--crimson);font-weight:700}
.bstage{margin-bottom:10px}
.bst-h{display:flex;gap:8px;align-items:baseline;font-size:14px}
.bst-h span{font-size:12.5px;color:#7b7e93}
.bfoot{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center}
.bfoot .logo{height:34px;width:auto}
@media print{
 @page{size:A4 landscape;margin:0}
 body{background:#fff}
 .bar,.demo,.nav,.bom-h,.bomwrap>.hint,#layer,.rail{display:none!important}
 .bomwrap{padding:0;max-width:none}
 .sheetbox{height:auto!important;overflow:visible;margin:0;page-break-after:always;break-after:page}
 .sheet{transform:scale(.8)!important;transform-origin:top right;border:0;box-shadow:none}
}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.k3,.k2{grid-template-columns:1fr}}
.k{border:1px solid var(--line-2);border-radius:16px;padding:12px 14px;text-align:right;background:var(--bg);display:grid;gap:4px;align-content:start;min-width:0}
.k:hover{border-color:var(--green)}
.k.span2{grid-column:span 2}
.k.span3{grid-column:1/-1}
@media (max-width:760px){.k.span2{grid-column:auto}}
.k small{font-size:12px;color:var(--muted);font-weight:700}
.k .kv{font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere}
.k .kv.empty{color:#b0b3c6}
.ktable{width:100%;border-collapse:collapse;font-size:13.5px}
.ktable th{font-size:12px;color:var(--muted);text-align:right;font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.ktable td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ktable .n{font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:0 10px;background:var(--sunken)}
.pill.g{background:var(--green-100);color:var(--green-600)}
.pill.a{background:var(--amber-100);color:var(--amber-ink)}
.pill.c{background:var(--crimson-100);color:#a3173f}
.overflow{overflow-x:auto}

/* ---------- review ---------- */
.miss{display:grid;gap:6px}
.miss button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;background:var(--bg);border:1px solid var(--line-2);border-radius:14px;padding:10px 14px;font-size:14px}
.miss button:hover{border-color:var(--green)}
.plancard{display:flex;gap:12px;align-items:center}
.plancard b{display:block}
.plancard span{font-size:13px;color:var(--ink-2)}

/* ---------- feedback ---------- */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score div{background:var(--sunken);border-radius:16px;padding:12px;text-align:center}
.score b{display:block;font-size:26px;font-weight:800}
.score small{font-size:12px;color:var(--ink-2)}
.lst{margin:0;padding-inline-start:20px}
.lst li{margin-block:4px}

/* ---------- auth + modal ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--bg)}
.auth-brand{position:relative;overflow:hidden;background:var(--sunken);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:24px}
.auth-brand .motif{position:absolute;left:-120px;bottom:-60px;width:560px;max-width:none;pointer-events:none}
.auth-brand .logo{height:38px;position:relative}
.auth-brand h2{position:relative;font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1.35;margin:0;max-width:13ch}
.auth-brand p{position:relative;margin:0;color:var(--ink-2);font-size:15.5px;max-width:40ch}

const S={user:null,data:{},feedback:null,submittedAt:null,view:'step'};
function newPlan(){return{id:uid(),test:{},run:{},stages:[0,1,2].map(()=>({goal:'',actions:[{},{}]})),team:{lead:{},exec:{},support:{}},risks:[{},{},{}],kpis:[],res:{},sup:{}}}
function normalize(d){d=d&&typeof d==='object'?d:{};d.meta=d.meta||{};d.forces=Array.isArray(d.forces)?d.forces:[];d.pairs=Array.isArray(d.pairs)?d.pairs:[];d.uncovered=Array.isArray(d.uncovered)?d.uncovered:[];d.summary=d.summary||{};
 d.forces.forEach(f=>{if(!f.kind)f.kind=KIND[f.name]||'g';if(f.aa==null&&f.a!=null){const n=num(f.n)||1;f.aa=String(+(num(f.a)/n).toFixed(1));f.mm=String(Math.round(num(f.m)/n));delete f.a;delete f.m}});d.plans=Array.isArray(d.plans)&&d.plans.length?d.plans:[newPlan()];d.plans.forEach(p=>{const n=newPlan();for(const k in n)if(p[k]==null)p[k]=n[k];RES.forEach(([k])=>p.res[k]=p.res[k]||{});['lead','exec','support'].forEach(k=>p.team[k]=p.team[k]||{})});return d}
const get=p=>p.split('.').reduce((o,k)=>o==null?undefined:o[k],S.data);
function set(p,v){const ks=p.split('.');let o=S.data;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};o=o[ks[i]]}o[ks.at(-1)]=v}
const forces=()=>S.data.forces.filter(f=>has(f.name));
const findForce=n=>forces().find(f=>f.name.trim()===String(n||'').trim());
const isP=f=>(f.kind||KIND[f.name]||'g')==='p';
const tA=f=>isP(f)?num(f.n):num(f.n)*num(f.aa),tM=f=>num(f.n)*num(f.mm);
const P=i=>S.data.plans[i];

/* ---------- the gap ---------- */
const isAct=f=>f.st==='قوی'||f.st==='متوسط';
const tAT=f=>isAct(f)?(has(f.act)?Math.min(num(f.act),tA(f)):tA(f)):0;
function gap(){const pop=num(S.data.pop);let a=0,aT=0,m=0;forces().forEach(f=>{a+=tA(f);aT+=tAT(f);m+=tM(f)});const mm=num(S.data.mReal)||m;
 const needA=pop*.1,needM=pop,ta=Math.min(num(S.data.ta),100),tm=Math.min(num(S.data.tm),100),aI=a-aT,aNew=Math.max(needA-a,0);
 return{pop,a,aT,aI,aNew,m:mm,needA,needM,gapA:Math.max(needA-aT,0),gapM:Math.max(needM-mm,0),aShare:needA?aT/needA*100:0,iShare:needA?aI/needA*100:0,mShare:needM?mm/needM*100:0,tgtA:pop*ta/100,tgtM:pop*tm/100,ta,tm}}
function planSplit(p){const d=planDelta(p),f=findForce(p.force),room=f&&MV[p.type]&&MV[p.type].way==='inv'?Math.max(tA(f)-num(p.baseA),0):0,inv=Math.min(d.dA,room);return{inv,fresh:d.dA-inv}}
const planCost=p=>p.costMode==='کل'?num(p.cost):COSTS.reduce((a,[k])=>a+num((p.costs||{})[k]),0);
const planQ=(p,i)=>{const q=QUARTERS.indexOf(p.q);return q>=0?q:Math.min(i,QUARTERS.length-1)};
const perHead=(cost,n)=>n>0&&cost>0?cost/n:0;
const money=v=>v>=1000?FA(v/1000,1)+' میلیارد تومان':v>=1?FA(v,v<10?1:0)+' میلیون تومان':FA(Math.round(v*1000))+' هزار تومان';
function verdict(p){const t=p.test||{},k=['stays','role','grows'];if(!k.every(x=>has(t[x])))return '';const v=k.every(x=>t[x]==='بله')?'تحول':'برنامه';if(v==='تحول'&&p.revise)p.revise=0;return v}
function planDelta(p){return{dA:Math.max(num(p.afterA)-num(p.baseA),0),dM:Math.max(num(p.afterM)-num(p.baseM),0)}}
function planImpact(p){const g=gap(),d=planDelta(p);return{...d,ofGapA:g.gapA?d.dA/g.gapA*100:0,ofGapM:g.gapM?d.dM/g.gapM*100:0,ofTgtA:g.tgtA>g.aT?d.dA/(g.tgtA-g.aT)*100:0}}
function allImpact(){const g=gap();let dA=0,dM=0;S.data.plans.forEach(p=>{const d=planDelta(p);dA+=d.dA;dM+=d.dM});return{dA,dM,ofGapA:g.gapA?dA/g.gapA*100:0,ofGapM:g.gapM?dM/g.gapM*100:0}}
function sentence(p){const m=MV[p.type];if(!m||!has(p.force)||!has(p.to))return '';return m.s({f:p.force,f2:p.force2,from:p.from||'…',to:p.to})}
const NEW_FORCES=[['کسبهٔ معتمد','هر روز با ده‌ها مشتری حرف می‌زنند و حرفشان در محله خریدار دارد.'],['رانندگان تاکسی و تاکسی اینترنتی','هر روز با مسافران تازه هم‌کلام می‌شوند.'],['ادمین‌های صفحه‌ها و کانال‌های محلی','هزاران دنبال‌کنندهٔ محلی دارند.'],['پزشکان و کادر درمان','مورد اعتماد مردم‌اند و مخاطب ثابت دارند.'],['ورزشکاران و مربیان باشگاه‌ها','نوجوانان و جوانان حرفشان را می‌شنوند.'],['معتمدان و بزرگان محله و طوایف','حرفشان در جمع خودشان فصل‌الخطاب است.']];
function opportunities(){
 const fs=forces(),O={},ratio=f=>tM(f)/Math.max(tA(f),1);
 O['تغییر نقش']=fs.filter(f=>(f.st==='ضعیف'||f.st==='متوسط')&&tM(f)>=500).sort((x,y)=>tM(y)-tM(x)).slice(0,3).map(f=>({f:f.name,why:`${FA(tM(f))} مخاطب دارد، اما کار تبیینی‌اش ${f.st} است.`,pa:f.st==='ضعیف'?tA(f):0,pm:0}));
 O['فعال‌سازی ظرفیت']=fs.filter(f=>f.st==='بلااستفاده'||(f.st==='ضعیف'&&tM(f)<500)).sort((x,y)=>tA(y)-tA(x)).slice(0,3).map(f=>({f:f.name,why:`${FA(tA(f))} کنشگر دارد که در تبیین ${f.st==='بلااستفاده'?'بی‌کار مانده‌اند':'کار ناچیزی دارند'}.`,pa:tA(f),pm:0}));
 O['ایجاد اتصال']=S.data.pairs.filter(x=>has(x.a)&&has(x.b)&&(x.lv==='کم'||x.lv==='هیچ')).slice(0,3).map(x=>({f:x.a,f2:x.b,why:`همکاری امروزشان ${x.lv==='هیچ'?'هیچ':'کم'} است.`,pa:0,pm:0}));
 O['فعال‌سازی مخاطب']=fs.filter(f=>tM(f)>=300&&ratio(f)>=40).sort((x,y)=>ratio(y)-ratio(x)).slice(0,3).map(f=>({f:f.name,why:`به ازای هر کنشگر ${FA(ratio(f))} مخاطب دارد؛ با فعال کردن بخشی از مخاطبان، تا ${FA(Math.min(Math.round(tM(f)/100),Math.max(tA(f)*3,10)))} کنشگر تازه ممکن است.`,pa:Math.min(Math.round(tM(f)/100),Math.max(tA(f)*3,10)),pm:0}));
 const names=fs.map(f=>f.name);O['افزودن نیروی جدید']=NEW_FORCES.filter(([x])=>!names.some(n=>n.includes(x.split(' ')[0]))).slice(0,4).map(([x,w])=>({f:x,why:w,pa:0,pm:0}));
 O['ورود به عرصهٔ جدید']=S.data.uncovered.slice(0,3).map(x=>({f:x,why:'امروز هیچ نیرویی به آن‌ها نمی‌رسد.',pa:0,pm:0}));
 return O}

class NetErr extends Error{constructor(m,code,body){super(m);this.code=code;this.body=body}}
async function req(url,opt={},ms=15000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);let r;
 try{r=await fetch(url,{credentials:'same-origin',...opt,signal:c.signal})}catch(e){throw new NetErr(navigator.onLine===false?'اینترنت قطع است.':'سرور پاسخ نداد؛ اتصال را بررسی کنید.','offline')}finally{clearTimeout(t)}
 const j=await r.json().catch(()=>({}));
 if(r.status===401)throw new NetErr(j.error||'نشست شما تمام شده است؛ دوباره وارد شوید.','auth',j);
 if(r.status===409)throw new NetErr(j.error||'این بوم روی دستگاه دیگری تغییر کرده است.','conflict',j);
 if(r.status===429)throw new NetErr(j.error||'تلاش‌ها زیاد بود؛ چند دقیقهٔ دیگر دوباره امتحان کنید.','rate',j);
 if(r.status===413)throw new NetErr('حجم داده بیش از حد مجاز است.','big',j);
 if(!r.ok)throw new NetErr(j.error||'خطای سرور؛ چند لحظهٔ دیگر دوباره تلاش کنید.','server',j);
 return j}

async function flush(force){clearTimeout(saveT);saveT=null;clearTimeout(retryT);if(blocked)return;if(saving){again=true;return}

  if(c==='auth'){blocked=true;status('err','نشست تمام شد');saving=false;return reLogin()}
  if(c==='conflict'){blocked=true;saving=false;status('err','تعارض نسخه');return conflict(e.body||{})}
  retryN++;const wait=[3,6,15,30,60][Math.min(retryN-1,4)];
  status('err',c==='offline'?'آفلاین؛ روی همین دستگاه نگه داشته شد':'ذخیره نشد؛ دوباره تلاش می‌کنیم');

  retryT=setTimeout(()=>flush(),wait*1000)}
 saving=false;if(again)flush()}

 if(d.add){const a=get(d.add)||[];a.push(d.add==='forces'?{id:uid()}:{});set(d.add,a);schedule();rerender();setTimeout(()=>{const its=$$('#step .item, #step .act');const l=its[its.length-1];if(l){l.scrollIntoView({behavior:'smooth',block:'center'});l.querySelector('input,select')?.focus({preventScroll:true})}},50);return}
 if(d.togforce){const k=S.data.forces.findIndex(x=>x.name===d.togforce);if(k<0){S.data.forces.push({id:uid(),name:d.togforce,kind:KIND[d.togforce]||'g'});S.fopen&&S.fopen.add(S.data.forces.length-1)}else{const it=S.data.forces[k];S.data.forces.splice(k,1);if(has(it.n)||has(it.st))toast(`«${it.name}» از فهرست برداشته شد.`,['بازگرداندن',()=>{S.data.forces.splice(k,0,it);schedule();rerender()}])}schedule();rerender();return}
 if(d.addcustom){const v=$('#newforce').value.trim();if(!v){$('#newforce').focus();return}if(!S.data.forces.some(x=>x.name===v)){S.data.forces.push({id:uid(),name:v,kind:d.addcustom});schedule();rerender();toast(`«${v}» اضافه شد.`)}return}
 if(d.kind){S.data.forces[+d.kind].kind=d.v;schedule();rerender();return}
 if(d.addforce){let k=S.data.forces.findIndex(x=>x.name===d.addforce);if(k<0){S.data.forces.push({id:uid(),name:d.addforce});k=S.data.forces.length-1;schedule();rerender()}setTimeout(()=>{const c=$('#force-'+k);if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.style.boxShadow='0 0 0 2px var(--green)';setTimeout(()=>c.style.boxShadow='',1200)}},40);return}
 if(d.addrisk){const p=P(+d.pl),r=p.risks.find(x=>!has(x.risk));if(r)r.risk=d.addrisk;else p.risks.push({risk:d.addrisk});schedule();rerender();return}
 if(d.del){const a=get(d.del),k=+d.i,it=a[k];a.splice(k,1);if(d.del==='plans'){S.pi=0;schedule();render();toast('طرح حذف شد.',['بازگرداندن',()=>{a.splice(k,0,it);schedule();render()}]);return}schedule();rerender();if(it&&Object.entries(it).some(([x,v])=>x!=='id'&&has(v)))toast('حذف شد.',['بازگرداندن',()=>{a.splice(k,0,it);schedule();rerender()}]);return}
 if(d.append){const c=String(get(d.append)||'').trim();set(d.append,c?c+(d.sep||' ')+d.v:d.v);schedule();rerender();return}
 if(d.show==='mreal'){S.showMreal=1;$('#mreal').hidden=false;t.remove();return}
 if(d.move){const i=+d.move;S.openMove=S.openMove===i?-2:i;rerender();return}
 if(d.pick){const m=MOVES[+d.pick],p=P(S.pi);if(p.type!==m.t||(d.f&&p.force!==d.f)){p.type=m.t;if(d.f){p.force=d.f;p.force2=d.f2||''}p.baseA='';p.baseM='';p.keep='';p.test={}}S.openMove=null;schedule();go('shift@'+S.pi);return}
 if(d.alt){const m=MOVES[+d.alt],np=newPlan();np.type=m.t;np.force=d.f;S.data.plans.push(np);S.pi=S.data.plans.length-1;schedule();toast('طرح تازه اضافه شد.');go('shift@'+S.pi);return}
 if(d.bomprint!==undefined){S.bomPrint=!S.bomPrint;render();return}
 if(d.bomzoom!==undefined){S.bomZoom=!S.bomZoom;render();return}
 if(d.print!==undefined){S.bomZoom=false;S.bomPrint=true;render();setTimeout(()=>window.print(),300);return}
 if(d.retry!==undefined){retryN=0;flush(true);return}
 if(d.keep){blocked=false;closeLayer();if(d.keep==='mine'){await flush(true);toast('نسخهٔ همین دستگاه ذخیره شد.')}else{const me=await API.me().catch(()=>null);if(me){S.data=normalize(me.data);S.rev=me.rev;dirty=false;localClean();app();toast('نسخهٔ روی سرور آمد.')}}return}
 if(d.jump!==undefined){if(GT){GT.scrollIntoView({behavior:'smooth',block:'center'});if(GT.matches('input,textarea'))setTimeout(()=>GT.focus({preventScroll:true}),350)}return}
 if(d.revise!==undefined){const p=P(+d.revise);Object.keys(p.test||{}).forEach(k=>{if(p.test[k]==='هنوز نه')p.test[k]=''});p.revise=1;schedule();go('shift@'+d.revise);return}
 if(d.openforce!==undefined){(S.fopen=S.fopen||new Set()).add(+d.openforce);rerender();setTimeout(()=>{const c=$('#force-'+d.openforce);if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.querySelector('input')?.focus({preventScroll:true})}},60);return}
 if(d.goplan){go('shift@'+d.goplan);return}
 if(d.addplan!==undefined){S.data.plans.push(newPlan());S.pi=S.data.plans.length-1;S.openMove=null;schedule();go('moves@'+S.pi);return}
 if(d.submit!==undefined){if(missing().length||t.disabled)return;t.disabled=true;const tx=t.textContent;t.textContent='در حال ارسال…';try{if(dirty)await flush(true);if(dirty)throw new Error('تغییرات هنوز ذخیره نشده است. پس از وصل شدن اینترنت دوباره بزنید.');S.submittedAt=await API.submit();render();toast('بوم‌ها ارسال شد.')}catch(err){t.disabled=false;t.textContent=tx;toast(err.code==='offline'?'اینترنت قطع است؛ بوم‌ها روی همین دستگاه محفوظ است. پس از وصل شدن دوباره بزنید.':err.message)}return}
 if(d.pw!==undefined){$('#menu')?.remove();showPw();return}
 if(d.intro!==undefined){$('#menu')?.remove();showIntro();return}
 if(d.eye){const i=document.getElementById(d.eye);i.type=i.type==='password'?'text':'password';return}
 if(d.closeIntro!==undefined){closeLayer();S.data.meta.intro=1;schedule(true);return}
 if(t.id==='logout'){$('#menu')?.remove();if(dirty)await flush(true);if(dirty&&!confirm2())return;if(!dirty){try{localStorage.removeItem(LKEY())}catch(e){}}await API.logout();S.user=null;start();return}
});

function showIntro(){$('#layer').innerHTML=`<div class="scrim"></div><div class="modal-wrap"><div class="modal intro" role="dialog" aria-modal="true" aria-labelledby="ih" style="max-width:560px"><img class="motif" src="motifs/ferferi-4-green.png" alt="">
 <div class="eyebrow">نقشهٔ هزار مشعل · بوم تحول آرایش نیروهای مجاهد تبیین</div><h2 id="ih" style="font-size:24px;line-height:1.5">باید آرایش جنگی بگیریم</h2>
 <p style="margin:0;color:var(--ink-2)">میان آنچه شهرستان لازم دارد، یعنی ۱۰٪ مردم کنشگر و همهٔ مردم مخاطب، و آنچه امروز داریم، شکافی جدی هست. این بوم‌ها برای این است که:</p>
 <div class="path"><div><span>۱</span><div><b>چرا</b><small>چرا همهٔ مردم مخاطب‌اند و چرا به ده درصد کنشگر نیاز داریم؛ راهبرد هزار مشعل.</small></div></div><div><span>۲</span><div><b>شکاف</b><small>نیروهای امروز را بنویسید تا معلوم شود چند کنشگر منتظر دعوت‌اند، چند کنشگر تازه لازم است و حرف به چند نفر نمی‌رسد.</small></div></div><div><span>۳</span><div><b>شش حرکت</b><small>تحول در آرایش نیروها یعنی چه و در شهرستان شما از کجا شروع می‌شود.</small></div></div><div><span>۴</span><div><b>طرح تحول</b><small>طرح را بچینید، هزینه‌اش را بنویسید، بسنجید که تحول است یا برنامه، و اگر لازم شد اصلاح یا عوضش کنید.</small></div></div><div><span>۵</span><div><b>اجرا</b><small>راهبر، سه مرحلهٔ شش ماه، مهم‌ترین مانع و کمکی که لازم دارید. هر سه ماه یک طرح تازه.</small></div></div></div>
 <p class="hint" style="margin:0 0 14px">حدود ۴۵ دقیقه. هر تغییر خودکار ذخیره می‌شود و می‌توانید در چند نوبت پر کنید.</p>
 <button class="btn pr wide" data-close-intro>شروع</button></div></div>`;document.body.style.overflow='hidden'}
function showPw(first){$('#layer').innerHTML=`<div class="scrim" data-close></div><div class="modal-wrap"><form class="modal" id="pwf"><h2>${first?'رمز موقت را عوض کنید':'تغییر رمز'}</h2><p class="hint" style="margin:0 0 12px">${first?'رمزی که اداره‌کل فرستاده موقت است. برای امنیت، یک رمز تازه که فقط خودتان می‌دانید بگذارید؛ دست‌کم ۶ نویسه.':'رمز تازه دست‌کم ۶ نویسه باشد.'}</p><div class="stack"><div class="fld"><label for="pw0">رمز فعلی</label><div class="pw"><input id="pw0" type="password" autocomplete="current-password"><button type="button" data-eye="pw0" aria-label="نمایش رمز">${I.eye}</button></div></div><div class="fld"><label for="pw1">رمز تازه</label><div class="pw"><input id="pw1" type="password" autocomplete="new-password"><button type="button" data-eye="pw1" aria-label="نمایش رمز">${I.eye}</button></div></div><div class="err" id="pwe"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn se sm" onclick="closeLayer()">${first?'بعداً':'انصراف'}</button><button class="btn pr sm">ذخیره</button></div></div></form></div>`;
 $('#pwf').onsubmit=async e=>{e.preventDefault();if(toEn($('#pw1').value).length<6)return $('#pwe').textContent='رمز تازه دست‌کم ۶ نویسه باشد.';try{await API.password($('#pw0').value,$('#pw1').value);closeLayer();toast('رمز تازه ذخیره شد.')}catch(err){$('#pwe').textContent=err.message}}}

 <main class="auth-form"><form id="lf" novalidate><div><h1>ورود</h1><p class="lead" style="margin:0">با شمارهٔ همراه و رمزی که اداره‌کل برایتان فرستاده.</p></div>
 <div class="fld"><label for="ph">شمارهٔ همراه</label><input id="ph" class="ltr" type="tel" inputmode="tel" autocomplete="username" placeholder="۰۹۱۲ ۰۰۰ ۰۰۰۰"></div>
 <div class="fld"><label for="pwd">رمز</label><div class="pw"><input id="pwd" type="password" autocomplete="current-password"><button type="button" data-eye="pwd" aria-label="نمایش رمز">${I.eye}</button></div></div>
 <div class="err" id="le" role="alert"></div><button class="btn pr wide" type="submit">ورود</button>
 <p class="help">رمز ندارید یا فراموش کرده‌اید؟ با معاونت فرهنگی اداره‌کل تبلیغات اسلامی استان تماس بگیرید.</p></form></main></div>`}
function confirm2(){toast('هنوز تغییراتی ذخیره نشده است. پس از وصل شدن اینترنت دوباره خروج را بزنید.');return false}
function failPage(msg){$('#app').innerHTML=`<div class="wrap" style="padding-top:60px;text-align:center">${LOGO}<h1 style="font-size:22px">به سرور وصل نشدیم</h1><p class="lead">${esc(msg)} اگر قبلاً روی این دستگاه چیزی نوشته‌اید، محفوظ است.</p><button class="btn pr" onclick="location.reload()">دوباره تلاش کن</button></div>`}
/* نمای فقط‌خواندنی برای مدیر کل: /admin/view?u=شناسه */
async function startAdminView(){const id=new URLSearchParams(location.search).get('u');READONLY=true;
 try{const me=await req('api/admin/users/'+encodeURIComponent(id||'')+'/form');S.user=me.user;S.data=normalize(me.data);S.feedback=me.feedback||null;S.submittedAt=me.submittedAt||null;S.view='bom';S.pi=0;document.title='بوم '+(me.user.county||'')+' · نقشهٔ هزار مشعل';$('#app').innerHTML=shell();render()}
 catch(e){$('#app').innerHTML=`<div class="wrap" style="padding-top:60px;text-align:center">${LOGO}<h1 style="font-size:22px">${e.code==='auth'?'اول وارد داشبورد شوید':'این بوم باز نشد'}</h1><p class="lead">${esc(e.message)}</p><a class="btn pr" href="./">رفتن به داشبورد</a></div>`}}
async function start(){if(/\/admin\/view\/?$/.test(location.pathname))return startAdminView();
 let me=null;try{me=await server.me();API=server}catch(e){return failPage(e.message)}
 if(!me){closeLayer();$('#app').innerHTML=loginHTML();$('#lf').onsubmit=async ev=>{ev.preventDefault();const ph=normPhone($('#ph').value),pw=$('#pwd').value;$('#le').textContent='';
  if(!/^09\d{9}$/.test(ph))return $('#le').textContent='شمارهٔ همراه را کامل وارد کنید؛ مثلاً ۰۹۱۲۳۴۵۶۷۸۹.';if(!pw)return $('#le').textContent='رمز را وارد کنید.';
  const b=ev.target.querySelector('[type=submit]');b.disabled=true;b.textContent='در حال ورود…';try{boot(await API.login(ph,pw))}catch(err){$('#le').textContent=err.message;b.disabled=false;b.textContent='ورود'}};return}
 boot(me)}
function boot(me){S.user=me.user;S.rev=me.rev||0;const loc=localGet();const srvAt=me.updatedAt?Date.parse(me.updatedAt):0;const useLocal=loc&&loc.dirty&&loc.data&&loc.at>srvAt;S.data=normalize(useLocal?loc.data:me.data);if(useLocal){dirty=true;setTimeout(()=>{toast('تغییراتی که دفعهٔ قبل ذخیره نشده بود، از همین دستگاه بازیابی شد.');flush()},600)}S.feedback=me.feedback||null;S.submittedAt=me.submittedAt||null;S.view='step';S.step=S.data.meta.step||'why1';S.pi=0;app();if(me.user.mustChange&&!sessionStorageGet('pwAsked')){sessionStorageSet('pwAsked','1');setTimeout(()=>showPw(true),400)}}
function sessionStorageGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function sessionStorageSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function app(){$('#app').innerHTML=shell();render()}

start();
