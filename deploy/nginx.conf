# /etc/nginx/sites-available/harfeno
# حالت ۱: یک دامنه — سایت مدیران روی / و داشبورد روی /admin/
# حالت ۲: دو دامنه — بلوک دوم را هم فعال کنید و در .env مقدار PUBLIC_HOST و ADMIN_HOST را بگذارید.

server {
    listen 80;
    server_name bom.example.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bom.example.ir;

    ssl_certificate     /etc/letsencrypt/live/bom.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bom.example.ir/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;   # تحلیل خودکار با Claude ممکن است چند دقیقه طول بکشد
    }

    # اختیاری: محدود کردن داشبورد به IP شبکهٔ اداره
    # location /admin/ {
    #     allow 1.2.3.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}

